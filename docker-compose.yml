services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database connection
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-gin_template_dev}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSLMODE=disable
      - DB_MAX_CONNS=${DB_MAX_CONNS:-10}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-2}

      # Server configuration
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_HOST=${SERVER_HOST:-}
      - SERVER_READ_TIMEOUT=${SERVER_READ_TIMEOUT:-15s}
      - SERVER_WRITE_TIMEOUT=${SERVER_WRITE_TIMEOUT:-15s}
      - SERVER_SHUTDOWN_TIMEOUT=${SERVER_SHUTDOWN_TIMEOUT:-10s}
      - SERVER_REQUEST_TIMEOUT=${SERVER_REQUEST_TIMEOUT:-30s}
      - GIN_MODE=${GIN_MODE:-debug}

      # JWT configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_TIMEOUT=${JWT_ACCESS_TOKEN_TIMEOUT:-15m}
      - JWT_REFRESH_TOKEN_TIMEOUT=${JWT_REFRESH_TOKEN_TIMEOUT:-168h}
      - JWT_ACCESS_TOKEN_COOKIE_NAME=${JWT_ACCESS_TOKEN_COOKIE_NAME:-access_token}
      - JWT_REFRESH_TOKEN_COOKIE_NAME=${JWT_REFRESH_TOKEN_COOKIE_NAME:-refresh_token}
      - JWT_REFRESH_COOKIE_PATH=${JWT_REFRESH_COOKIE_PATH:-/api/auth/refresh}
      - JWT_COOKIE_DOMAIN=${JWT_COOKIE_DOMAIN:-}
      - JWT_SECURE_COOKIE=${JWT_SECURE_COOKIE:-false}
      - JWT_REALM=${JWT_REALM:-API}

      # Logger configuration
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_FORMAT=${LOG_FORMAT:-text}

      # CORS configuration
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - CORS_MAX_AGE_SECONDS=${CORS_MAX_AGE_SECONDS:-3600}

      # Rate limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      - RATE_LIMIT_WINDOW_DURATION=${RATE_LIMIT_WINDOW_DURATION:-1m}
      - RATE_LIMIT_CLEANUP_INTERVAL=${RATE_LIMIT_CLEANUP_INTERVAL:-5m}
      - RATE_LIMIT_RECORD_EXPIRY=${RATE_LIMIT_RECORD_EXPIRY:-10m}
    env_file:
      - .env
    ports:
      - "${HOST_BACKEND_PORT:-8080}:8080"
    volumes:
      - .:/app
      - /app/tmp
      # Mount Docker socket for testcontainers
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    platform: linux/amd64
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-gin_template_dev}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gin_template_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
